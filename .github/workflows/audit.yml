name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: /tmp/mime-infer-audit-target
  RUSTUP_TOOLCHAIN: 1.95.0
  CARGO_AUDIT_VERSION: 0.22.0

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust 1.95.0
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Restore cargo-audit
        id: audit-tool-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.CARGO_AUDIT_VERSION }}-v1

      - name: Install cargo-audit
        if: steps.audit-tool-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION" --root "$RUNNER_TEMP/cargo-audit"

      - name: Add cargo-audit to PATH
        run: echo "$RUNNER_TEMP/cargo-audit/bin" >> "$GITHUB_PATH"

      - name: Verify cargo-audit
        run: cargo audit --version

      - name: Resolve all dependencies
        run: cargo generate-lockfile

      - name: Audit resolved dependencies
        run: cargo audit --db "$RUNNER_TEMP/mime-infer-advisory-db"
