name: Dependency audit

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: /tmp/mime-infer-audit-target
  RUSTUP_TOOLCHAIN: 1.95.0

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust 1.95.0
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.0

      - name: Resolve all dependencies
        run: cargo generate-lockfile

      - name: Audit resolved dependencies
        run: cargo audit --db "$RUNNER_TEMP/mime-infer-advisory-db"
