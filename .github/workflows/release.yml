name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out tagged commit and main history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a version tag on main
        id: version
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = tag
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          grep -Fx "## $version" CHANGELOG.md
          echo "version=$version" >> "$GITHUB_OUTPUT"

  rust:
    needs: validate-tag
    uses: ./.github/workflows/rust.yml

  audit:
    needs: validate-tag
    uses: ./.github/workflows/audit.yml

  typos:
    needs: validate-tag
    uses: ./.github/workflows/typos.yml

  publish:
    needs: [validate-tag, rust, audit, typos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      CARGO_TARGET_DIR: /tmp/mime-infer-release-target
      CARGO_TERM_COLOR: always
      VERSION: ${{ needs.validate-tag.outputs.version }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust 1.95.0
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Resolve dependencies
        run: cargo generate-lockfile

      - name: Publish and verify the registry package
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 .github/scripts/publish.py "$VERSION" "$GITHUB_SHA" "$CARGO_TARGET_DIR/release"

      - name: Create GitHub Release with the published package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          package="$CARGO_TARGET_DIR/release/mime-infer-$VERSION.crate"
          notes="$CARGO_TARGET_DIR/release/notes.md"
          awk -v heading="## $VERSION" '$0 == heading {show=1; next} /^## / && show {exit} show {print}' CHANGELOG.md > "$notes"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$package" "$package.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "$package" "$package.sha256" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --title "mime-infer $VERSION" \
              --notes-file "$notes" --latest
          fi
